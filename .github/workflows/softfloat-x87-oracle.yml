name: SoftFloat x87 acos/bank oracle

# Dual-build SoftFloat vs hardware x87 on Linux Intel and compare extended
# acos / bank_margin dumps for the shared guidance path, plus FSIN/FCOS/FPTAN/
# FPATAN double-match floors.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/math/**'
      - 'src/flight/aerodynamic_guidance.cpp'
      - 'third_party/bochs_softfloat_ext/**'
      - 'cmake/softfloat.cmake'
      - 'tests/soft_x87_acos_bank_oracle_probe.cpp'
      - 'tests/soft_x87_trig_oracle_probe.cpp'
      - 'tools/compare_acos_bank_oracle.py'
      - 'tools/compare_trig_oracle.py'
      - '.github/workflows/softfloat-x87-oracle.yml'
  push:
    branches: [master]
    paths:
      - 'src/math/**'
      - 'src/flight/aerodynamic_guidance.cpp'
      - 'third_party/bochs_softfloat_ext/**'
      - 'cmake/softfloat.cmake'
      - 'tests/soft_x87_acos_bank_oracle_probe.cpp'
      - 'tests/soft_x87_trig_oracle_probe.cpp'
      - 'tools/compare_acos_bank_oracle.py'
      - 'tools/compare_trig_oracle.py'
      - '.github/workflows/softfloat-x87-oracle.yml'

permissions:
  contents: read

concurrency:
  group: softfloat-x87-oracle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oracle:
    name: linux-x86_64 hardware vs SoftFloat
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_MAXSIZE: 500M
      CMAKE_BUILD_PARALLEL_LEVEL: 3
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          lfs: false

      - name: Install Linux dependencies
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++-16 ninja-build ccache \
            libgl-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols
          echo CC=gcc-16 >> "$GITHUB_ENV"
          echo CXX=g++-16 >> "$GITHUB_ENV"

      - name: Restore compiler cache
        uses: actions/cache@v5
        with:
          path: .cache/ccache
          key: ccache-softfloat-oracle-${{ hashFiles('cmake/**', 'CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ccache-softfloat-oracle-${{ hashFiles('cmake/**', 'CMakeLists.txt') }}-
            ccache-softfloat-oracle-

      - name: Configure hardware x87
        run: |
          cmake -S . -B build-hw -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON -DBUILD_SHARED_LIBS=OFF -DTFX_STATIC_RUNTIME=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_glfw3=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build hardware oracle probes
        run: |
          cmake --build build-hw --target soft_x87_acos_bank_oracle_probe soft_x87_trig_oracle_probe

      - name: Run hardware oracles
        run: |
          ./build-hw/soft_x87_acos_bank_oracle_probe | tee hardware.oracle
          ./build-hw/soft_x87_trig_oracle_probe | tee hardware-trig.oracle

      - name: Configure SoftFloat on x87 host
        run: |
          cmake -S . -B build-soft -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON -DBUILD_SHARED_LIBS=OFF -DTFX_STATIC_RUNTIME=ON \
            -DTFX_FORCE_SOFT_X87=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_glfw3=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build SoftFloat oracle probes
        run: |
          cmake --build build-soft --target soft_x87_acos_bank_oracle_probe soft_x87_trig_oracle_probe

      - name: Run SoftFloat oracles
        run: |
          ./build-soft/soft_x87_acos_bank_oracle_probe | tee softfloat.oracle
          ./build-soft/soft_x87_trig_oracle_probe | tee softfloat-trig.oracle

      - name: Compare extended acos/bank dumps
        run: python3 tools/compare_acos_bank_oracle.py hardware.oracle softfloat.oracle

      - name: Report asin / asin_sqrt diagnostics
        if: always()
        run: |
          python3 tools/compare_acos_bank_oracle.py hardware.oracle softfloat.oracle \
            --fields asin,asin_sqrt || true

      - name: Compare trig dumps
        run: python3 tools/compare_trig_oracle.py hardware-trig.oracle softfloat-trig.oracle

      - name: Upload oracle dumps
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: softfloat-x87-oracles
          path: |
            hardware.oracle
            softfloat.oracle
            hardware-trig.oracle
            softfloat-trig.oracle
          if-no-files-found: ignore
